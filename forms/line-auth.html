<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>เข้าสู่ระบบ — หจก.สวีทเฮาส์ เดซี่</title>
  <style>
    :root { color-scheme: light; font-family: "Sukhumvit Set", "Thonburi", "Noto Sans Thai", Arial, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #eef2f6; color: #102a43; }
    main { width: min(420px, calc(100vw - 32px)); padding: 28px; text-align: center; background: #fff; border: 1px solid #d9e2ec; border-radius: 16px; box-shadow: 0 12px 28px rgba(16, 42, 67, .08); }
    h1 { margin: 0 0 12px; font-size: 22px; }
    p { margin: 0; color: #52606d; }
    [data-line-auth-status][data-kind="error"] { margin-top: 18px; color: #b91c1c; }
    .safe-area { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  </style>
</head>
<body>
  <main class="safe-area" aria-live="polite">
    <h1>ระบบบัญชี หจก.สวีทเฮาส์ เดซี่</h1>
    <p data-line-auth-status>กำลังเตรียมระบบ...</p>
  </main>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="/line-auth.browser.js" data-line-liff-id="__LINE_LIFF_ID__"></script>
</body>
</html>
