<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ตรวจสอบไฟล์ — หจก.สวีทเฮาส์ เดซี่</title>
  <style>
    :root { color: #102a43; font-family: "Sukhumvit Set", "Thonburi", "Noto Sans Thai", Arial, sans-serif; }
    body { min-height: 100vh; margin: 0; background: #eef2f6; }
    main { width: min(520px, calc(100vw - 32px)); margin: 0 auto; padding: 28px 0; }
    .panel { padding: 24px; background: #fff; border: 1px solid #d9e2ec; border-radius: 16px; box-shadow: 0 12px 28px rgba(16,42,67,.08); }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { color: #52606d; line-height: 1.6; }
    dl { margin: 22px 0; }
    dt { margin-top: 12px; color: #7b8794; font-size: 12px; }
    dd { margin: 2px 0 0; overflow-wrap: anywhere; font-weight: 700; }
    form { display: grid; gap: 12px; margin-top: 22px; }
    label { display: grid; gap: 4px; color: #52606d; font-size: 13px; font-weight: 700; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #bcccdc; border-radius: 8px; box-sizing: border-box; color: #102a43; font: inherit; }
    textarea { min-height: 72px; resize: vertical; }
    [data-confirm] { background: #0f766e; }
    [data-cancel] { background: #b91c1c; }
    [data-warnings] { color: #92400e; white-space: pre-line; }
    button { width: 100%; padding: 12px 16px; border: 0; border-radius: 10px; color: #fff; background: #b91c1c; font: inherit; font-weight: 700; cursor: pointer; }
    [data-status][data-kind="error"] { color: #b91c1c; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <section class="panel" aria-live="polite">
      <h1>ตรวจสอบไฟล์จาก LINE</h1>
      <p data-status>กำลังโหลดรายการ...</p>
      <p data-warnings hidden></p>
      <dl data-details hidden>
        <dt>ชื่อไฟล์</dt><dd data-name></dd>
        <dt>ประเภท</dt><dd data-type></dd>
        <dt>ขนาด</dt><dd data-size></dd>
        <dt>สถานะ</dt><dd data-state></dd>
      </dl>
      <form data-confirm-form hidden>
        <label>เดือนบัญชี<input name="accountingMonth" type="month" required></label>
        <label>วันที่ค่าใช้จ่าย<input name="expenseDate" type="date"></label>
        <label>ชื่อผู้ขอ<input name="requesterName" required></label>
        <label>ผู้ขาย/ผู้รับเงิน<input name="paymentTargetName" required></label>
        <label>วัตถุประสงค์<input name="businessPurpose" required></label>
        <label>รายละเอียดรายการ<textarea name="description" required></textarea></label>
        <label>ยอดก่อน VAT<input name="amountBeforeVat" inputmode="decimal" required></label>
        <label>VAT<input name="vatAmount" inputmode="decimal" value="0"></label>
        <label>หัก ณ ที่จ่าย<input name="withholdingTax" inputmode="decimal" value="0"></label>
        <button type="submit" data-confirm>ยืนยันสร้างแบบร่างใบเบิกจ่าย</button>
      </form>
      <button type="button" data-cancel hidden>ยกเลิกรายการนี้</button>
    </section>
  </main>
  <script src="/line-intake.browser.js"></script>
</body>
</html>
