<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopee Custom Label - หจก.สวีทเฮาส์</title>
  <link rel="stylesheet" href="/shopee-workflow.css">
  <link rel="stylesheet" href="/mobile-menu.css">
</head>
<body>
  <shopee-header page-title="Shopee Custom Label จาก PDF" page-subtitle="อัปโหลดใบปะหน้าเอง แล้วเติม Manual SKU หลายตัวต่อรายการสินค้า"></shopee-header>

  <main class="page custom-label-page">
    <section class="section">
      <div class="section-header"><h2 class="section-title">1. อัปโหลดใบปะหน้า Shopee</h2></div>
      <div class="section-body">
        <div id="shopeeCustomLabelStatus" class="status-box" role="status" aria-live="polite"></div>
        <div class="custom-label-upload-row">
          <label class="field" for="shopeeCustomLabelFile">
            <span>ไฟล์ PDF แบบหลายออเดอร์</span>
            <input id="shopeeCustomLabelFile" type="file" accept="application/pdf,.pdf">
          </label>
          <button class="button primary" id="uploadShopeeCustomLabelButton" type="button">อ่านไฟล์ PDF</button>
        </div>
        <div id="shopeeCustomLabelFileInfo" class="muted">ยังไม่ได้เลือกไฟล์</div>
      </div>
    </section>

    <section class="section custom-label-editor-section">
      <div class="section-header">
        <h2 class="section-title">2. ตรวจสอบรายการและกรอก Manual SKU</h2>
        <span id="shopeeCustomLabelProgress" class="muted"></span>
      </div>
      <div class="section-body">
        <div class="custom-label-toolbar">
          <label class="field custom-label-page-picker" for="shopeeCustomLabelPages">
            <span>หน้า PDF</span>
            <select id="shopeeCustomLabelPages" disabled><option>อัปโหลดไฟล์ก่อน</option></select>
          </label>
          <div class="muted">รายการที่มีชื่อ/ตัวเลือกเดิมจะดึง bundle เดิมมาให้แก้ไขต่อได้</div>
        </div>
        <div id="shopeeCustomLabelItems" class="custom-label-items">
          <div class="empty-state">อัปโหลด PDF เพื่อเริ่มกรอกข้อมูล</div>
        </div>
        <div class="actions">
          <button class="button primary" id="saveShopeeCustomLabelButton" type="button" disabled>Save และสร้าง PDF</button>
          <button class="button secondary" id="downloadShopeeCustomLabelButton" type="button" hidden>ดาวน์โหลด PDF ที่บันทึก</button>
          <button class="button secondary" id="printShopeeCustomLabelButton" type="button" hidden>เปิด PDF เพื่อพิมพ์</button>
          <button class="button secondary" id="openShopeeCustomLabelComparisonButton" type="button" hidden>เปิด PDF เทียบซ้าย-ขวา</button>
        </div>
      </div>
    </section>
  </main>

  <template id="customLabelBundleTemplate"><div data-custom-label-bundle><input data-custom-label-sku><input data-custom-label-quantity><button data-custom-label-remove type="button">ลบ</button></div></template>
  <script src="/shopee-header.browser.js"></script>
  <script src="/shopee-custom-label.logic.browser.js?v=manual-sku-plain-1"></script>
</body>
</html>
