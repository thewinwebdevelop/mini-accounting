<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopee Orders - หจก.สวีทเฮาส์</title>
  <link rel="stylesheet" href="/shopee-workflow.css">
  <link rel="stylesheet" href="/mobile-menu.css">
</head>
<body>
  <shopee-header page-title="Shopee Orders" page-subtitle="ตรวจสอบรายการสั่งซื้อและเลือก order สำหรับขั้นตอนถัดไป"></shopee-header>
  <main class="page"><section class="section"><div class="section-header"><h2 class="section-title">รายการ Shopee orders</h2><span id="shopeeSelectedCount" class="muted"></span></div><div class="section-body">
    <div class="actions"><label class="field" style="min-width:240px" for="shopeeShopId"><span>Shop ID</span><input id="shopeeShopId" placeholder="เช่น 123456789" autocomplete="off"></label><button class="button secondary" id="refreshShopeeOrdersButton" type="button">Refresh orders</button></div>
    <div id="shopeeOrderStatus" class="status-box"></div>
    <div class="table-wrap"><table><thead><tr><th style="width: 8%;">เลือก</th><th>Order</th><th>สถานะ</th><th>Mapping</th><th>Tracking</th></tr></thead><tbody id="shopeeOrderRows"></tbody></table></div>
    <div class="actions"><button class="button primary" id="openShopeeMappingButton" type="button" disabled>ไป Manual SKU Mapping</button><button class="button secondary" id="openShopeeShipmentButton" type="button" disabled>ไป Shipment & Label</button></div>
  </div></section></main>
  <script src="/shopee-header.browser.js"></script>
  <script src="/shopee-orders.logic.browser.js"></script>
</body>
</html>
