<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shopee Shipment & Label - หจก.สวีทเฮาส์</title><link rel="stylesheet" href="/shopee-workflow.css"><link rel="stylesheet" href="/mobile-menu.css"></head>
<body>
  <shopee-header page-title="Shipment &amp; Custom Label" page-subtitle="นัดรับสินค้า ดึงใบปะหน้า Shopee และเติม Stock SKU แบบ batch"></shopee-header>
  <main class="page"><section class="section"><div class="section-header"><h2 class="section-title">Batch shipment & label</h2></div><div class="section-body">
    <div class="actions"><label class="field" style="min-width:240px" for="shopeeShopId"><span>Shop ID</span><input id="shopeeShopId" placeholder="เช่น 123456789" autocomplete="off"></label><button class="button secondary" id="loadShopeeShipmentOrdersButton" type="button">โหลด Order ที่เลือก</button></div>
    <div id="shopeeBatchStatus" class="status-box"></div>
    <div class="actions"><button class="button primary" id="prepareShopeeShipmentButton" type="button">เตรียมจัดส่ง</button><button class="button secondary" id="arrangeShopeeShipmentButton" type="button" disabled>กดนัดรับสินค้า</button><button class="button secondary" id="refreshShopeeTrackingButton" type="button" disabled>Refresh Tracking</button><button class="button secondary" id="createShopeeDocumentsButton" type="button" disabled>ดึงใบปะหน้า Shopee</button><button class="button primary" id="overlayShopeeLabelsButton" type="button" disabled>สร้าง Custom Label</button><button class="button primary" id="printShopeeLabelsButton" type="button" disabled>Print Preview</button></div>
    <div id="shopeeShipmentOrders" class="muted">ยังไม่ได้โหลด order</div><div id="shopeeBatchChoices" class="batch-list"></div>
    <div class="actions"><a class="button secondary" id="backToShopeeMappingButton" href="/shopee-mapping">กลับไป Manual SKU</a></div>
  </div></section></main>
  <script src="/shopee-header.browser.js"></script>
  <script src="/shopee-shipment.logic.browser.js"></script>
</body>
</html>
